<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promptimizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Editorial Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;500;600&display=swap" rel="stylesheet">

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: '#09090b', // Zinc 950
              surface: '#18181b',    // Zinc 900
              border: '#27272a',     // Zinc 800
              text: '#e4e4e7',       // Zinc 200
              muted: '#a1a1aa',      // Zinc 400
            },
            fontFamily: {
              serif: ['"Source Serif 4"', 'serif'],
              sans: ['"IBM Plex Sans"', 'sans-serif'],
            },
            animation: {
              'in': 'enter 0.4s cubic-bezier(0.2, 0.0, 0.2, 1) forwards',
            }
          }
        }
      }
    </script>
    <script>
      // Polyfill process.env for browser environments
      if (typeof process === 'undefined') {
        window.process = { env: {} };
      }
    </script>
    <style>
      body {
        background-color: #09090b;
        color: #e4e4e7;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Editorial Focus Ring */
      textarea:focus, input:focus, button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px #27272a, 0 0 0 4px #09090b;
      }

      /* Subtle Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b;
      }

      /* Animation Utility */
      @keyframes enter {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-enter {
        animation: enter 0.4s cubic-bezier(0.2, 0.0, 0.2, 1) forwards;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
